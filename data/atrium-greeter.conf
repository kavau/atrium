# /etc/atrium-greeter.conf - atrium greeter configuration
# Lines starting with '#' are comments. Unknown keys are ignored.

# Seconds of inactivity before the screen blanks. Set to 0 to disable.
blank-timeout = 300

# Base font size in pixels. All UI text is scaled relative to this value.
base-font-size = 28

# Heading text shown on the login screen.
login-label = Log in

# Wayland cursor theme name.
cursor-theme = Adwaita

# Cursor size in pixels.
cursor-size = 36

# Accounts not included in the login screen's user list. Repeat for multiple
# users. This is cosmetic: the account can still log in by other means.
#
# Example:
#   hide-user = backup
#   hide-user = testaccount

# Path to a background image or directory. If a directory is given, a random
# image from it is chosen each time the greeter starts.
# Supported formats depend on installed gdk-pixbuf loaders (JPEG and PNG are
# always available; WebP, GIF, BMP, SVG, TIFF on most systems).
#
# Examples: 
#   background-image = /usr/share/backgrounds/my-wallpaper.jpg
#   background-image = /usr/share/backgrounds/

# Path to an external CSS theme file containing @define-color declarations to
# override the default palette and/or direct CSS rules to override the layout
# defaults. Built-in themes are installed at /usr/share/atrium/themes/ (package
# install) or /usr/local/share/atrium/themes/ (source builds).
#
# Example:
#   theme = /usr/local/share/atrium/themes/catppuccin-latte.css

# ---------------------------------------------------------------------------
# Per-seat overrides
#
# Each seat can define its own override values for any of the keys above by
# putting them in a section named after the seat. The section name must match
# the seat name reported by `loginctl list-seats` exactly.
#
# Example: custom theme and background for seat1
#   [seat1] 
#   theme = /usr/local/share/atrium/themes/catppuccin-latte.css
#   background-image = /usr/share/backgrounds/seat1-wallpaper.png
